services:
  #Base de datos de la app
  mariadb:
    image: mariadb:11.4
    container_name: lab1_mariadb
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: lab1
      MARIADB_USER: lab1
      MARIADB_PASSWORD: lab1
    ports:
      - "3307:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    container_name: keycloak
    # start.sh ejecuta "kc.sh start-dev --import-realm":
    #   start-dev: modo desarrollo (HTTP, sin cache de temas, BD embebida)
    #   --import-realm: importa los realms en /opt/keycloak/data/import al arrancar
    # y además permite HTTP en el realm master para poder entrar a la consola.
    entrypoint: ["/bin/bash", "/opt/keycloak/start.sh"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "8180:8080"
    volumes:
      - ./keycloak/realm-veterinaria.json:/opt/keycloak/data/import/realm-veterinaria.json:ro
      - ./keycloak/start.sh:/opt/keycloak/start.sh:ro

volumes:
  mariadb_data:
